pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id 'com.android.application' version '8.5.1'
        id 'com.android.library' version '8.5.1'
        id 'org.jetbrains.kotlin.android' version '2.0.0'
    }
}

dependencyResolutionManagement {
    // Capacitor apni build.gradle mein repositories add karta hai.
    // PREFER_PROJECT ki wajah se Capacitor repositories ko allow kiya jayega.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Hadi Studio"

include ':app'
include ':capacitor-cordova-android-plugins'

project(':capacitor-cordova-android-plugins').projectDir =
        new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
