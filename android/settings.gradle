pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id 'com.android.application' version '8.5.1'
        id 'com.android.library' version '8.5.1'
        id 'org.jetbrains.kotlin.android' version '2.0.0'
    }
}

dependencyResolutionManagement {
    // Capacitor اپنی build.gradle میں Google repository add کرتا ہے،
    // اس لیے FAIL_ON_PROJECT_REPOS کی وجہ سے build fail نہ ہو۔
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Hadi Studio"

include ':app'
include ':capacitor-cordova-android-plugins'

project(':capacitor-cordova-android-plugins').projectDir =
        new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
