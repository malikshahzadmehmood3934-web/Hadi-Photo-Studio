pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id 'com.android.application' version '8.5.1'
        id 'com.android.library' version '8.5.1'
        id 'org.jetbrains.kotlin.android' version '2.0.0'
    }
}

dependencyResolutionManagement {
    // FAIL_ON_PROJECT_REPOS karne se Capacitor wali error khatam ho jayegi
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Hadi Studio"

include ':app'
include ':capacitor-cordova-android-plugins'

project(':capacitor-cordova-android-plugins').projectDir =
        new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
