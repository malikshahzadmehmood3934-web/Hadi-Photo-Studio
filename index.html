<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Wedding + Shop Software</title>
<style>
body { margin:0; font-family:Arial; background:#1e1e2f; color:#fff; }
.header { background:#2d2d44; padding:15px; display:flex; justify-content:space-between; align-items:center; }
.sidebar { width:220px; background:#252538; height:100vh; position:fixed; padding-top:20px; }
.sidebar button { width:90%; margin:10px; padding:12px; background:#4a4aff; border:none; color:#fff; border-radius:5px; cursor:pointer; font-size:15px; }
.sidebar button:hover { background:#6a6aff; }
.content { margin-left:240px; padding:20px; }
.card { background:#2d2d44; padding:20px; border-radius:10px; margin-bottom:20px; }
table { width:100%; border-collapse:collapse; background:#252538; }
th,td { padding:10px; border:1px solid #444; text-align:left; }
th { background:#4a4aff; }
input,select { padding:8px; margin:5px; border-radius:5px; border:none; }
.btn { padding:10px 15px; background:#00c851; border:none; color:#fff; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <h2>👑 Royal Wedding + Shop Software</h2>
  <span id="datetime"></span>
</div>

<div class="sidebar">
  <button onclick="showTab('guests')">👰 Wedding Guests</button>
  <button onclick="showTab('shop')">🛒 Shop Billing</button>
  <button onclick="showTab('reports')">📊 Reports</button>
  <button onclick="downloadExcel()">📥 Export Excel</button>
</div>

<div class="content">
  <div id="guests" class="tab">
    <div class="card">
      <h3>Add Guest</h3>
      <input id="gname" placeholder="Guest Name">
      <input id="gphone" placeholder="Phone">
      <input id="gtable" placeholder="Table #">
      <button class="btn" onclick="addGuest()">+ Add Guest</button>
    </div>
    <table id="guestTable"><tr><th>#</th><th>Name</th><th>Phone</th><th>Table</th></tr></table>
  </div>

  <div id="shop" class="tab" style="display:none">
    <div class="card">
      <h3>New Bill</h3>
      <input id="item" placeholder="Item Name">
      <input id="price" type="number" placeholder="Price">
      <input id="qty" type="number" placeholder="Qty" value="1">
      <button class="btn" onclick="addItem()">Add to Bill</button>
      <h4>Total: Rs. <span id="total">0</span></h4>
    </div>
    <table id="billTable"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></table>
  </div>

  <div id="reports" class="tab" style="display:none">
    <div class="card"><h3>Reports Coming Soon</h3></div>
  </div>
</div>

<script>
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.getElementById(id).style.display='block';
}
let guests=[], bill=[], total=0;
function addGuest(){
  let g={name:gname.value,phone:gphone.value,table:gtable.value};
  guests.push(g);
  guestTable.innerHTML += `<tr><td>${guests.length}</td><td>${g.name}</td><td>${g.phone}</td><td>${g.table}</td></tr>`;
  gname.value=gphone.value=gtable.value='';
}
function addItem(){
  let item={name:item.value,qty:+qty.value,price:+price.value,total:+qty.value*+price.value};
  bill.push(item); total+=item.total;
  billTable.innerHTML += `<tr><td>${item.name}</td><td>${item.qty}</td><td>${item.price}</td><td>${item.total}</td></tr>`;
  document.getElementById('total').innerText=total;
  item.value=price.value=''; qty.value=1;
}
function downloadExcel(){
  alert('Excel Download - Premium Feature');
}
setInterval(()=>{datetime.innerText=new Date().toLocaleString()},1000);
</script>
</body>
</html>
